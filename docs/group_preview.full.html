<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Group Previewer</title>
    <style>
      body {
        font-family: Inter, Arial, Helvetica, sans-serif;
        background: #071022;
        color: #e6eef8;
        margin: 0;
        padding: 18px;
      }
      .top {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      .btn {
        background: #0ea5a4;
        color: #042029;
        padding: 8px 12px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
      }
      .viewer {
        display: flex;
        gap: 16px;
      }
      .sidebar {
        width: 340px;
        max-height: 84vh;
        overflow: auto;
        /* keep sidebar visible while main content scrolls */
        position: sticky;
        top: 18px;
        align-self: flex-start;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .page-wrap {
        position: relative;
        background: #061021;
        padding: 8px;
        border-radius: 8px;
        overflow: auto;
      }
      .page-img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .overlay {
        position: absolute;
        left: 8px;
        top: 8px;
      }
      .group-box {
        position: absolute;
        box-sizing: border-box;
        border: 3px solid rgba(250, 180, 80, 0.95);
        background: rgba(250, 180, 80, 0.06);
        pointer-events: none;
        transition: box-shadow 120ms ease, border-color 120ms ease;
      }

      /* Selected/highlighted group - strong red border */
      .group-selected {
        border: 3px solid rgba(240, 60, 60, 0.95) !important;
        box-shadow: 0 0 0 6px rgba(240, 60, 60, 0.06);
      }

      /* Member boxes (dashed, light grey) to show constituent items in a group */
      .member-box {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed rgba(200, 200, 200, 0.75);
        background: rgba(255, 255, 255, 0.015);
        pointer-events: none;
      }

      /* Blocked text block overlay (solid black border) */
      .member-box.blocked {
        border: 2px solid rgba(10, 10, 10, 0.95);
        background: rgba(0, 0, 0, 0.06);
      }
      .group-item {
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
      }
      .group-item:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .group-item.selected {
        border: 2px solid rgba(240, 60, 60, 0.95);
        background: rgba(240, 60, 60, 0.06);
      }
      .group-meta {
        font-size: 13px;
        color: #9fb0cc;
      }
      .preview-panel {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .thumbs {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 380px;
      }
      .thumb {
        width: 100%;
        border-radius: 6px;
        background: #0b1220;
        padding: 6px;
      }
      .thumb img {
        width: 100%;
        height: auto;
        border-radius: 4px;
      }
      .thumb.blocked {
        opacity: 0.5;
      }
      .texts {
        flex: 1;
        max-height: 360px;
        overflow: auto;
        padding: 8px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 6px;
      }
      .text-block {
        padding: 6px;
        margin-bottom: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.01);
        font-size: 13px;
      }
      .text-block.blocked {
        opacity: 0.45;
        text-decoration: line-through;
        color: #9fb0cc;
        background: rgba(255, 255, 255, 0.005);
        border: 2px solid rgba(10, 10, 10, 0.95);
        padding: 6px;
      }
      .small {
        font-size: 13px;
        color: #9fb0cc;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <label class="btn"
        >📁 Load Grouped JSON<input
          id="jsonFile"
          type="file"
          accept="application/json"
          style="display: none"
      /></label>
      <label class="btn" style="background: #1e293b"
        >🖼️ Images folder<input
          id="imgFolder"
          type="file"
          webkitdirectory
          directory
          multiple
          style="display: none"
      /></label>
      <div style="margin-left: auto" class="small">
        Click a group to preview its images & texts
      </div>
      <label class="small" style="margin-left: 8px">
        <input id="hideBlocked" type="checkbox" /> Hide blocked items
      </label>
    </div>

    <div class="viewer">
      <div class="sidebar">
        <div id="meta" class="small">No JSON loaded</div>
        <hr />
        <div id="groupsList">Load a grouped JSON to see groups</div>
      </div>

      <div class="main">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
            flex-wrap: wrap;
          "
        >
          <button
            id="prevPageBtn"
            class="btn"
            style="padding: 6px 14px; font-size: 18px"
          >
            ⟨
          </button>
          <span id="pageInfo" class="small">Page 1</span>
          <button
            id="nextPageBtn"
            class="btn"
            style="padding: 6px 14px; font-size: 18px"
          >
            ⟩
          </button>
          <span
            id="layoutInfo"
            class="small"
            style="margin-left: 18px; color: #fbbf24; font-weight: 600"
          ></span>
        </div>
        <div
          id="layoutDesc"
          class="small"
          style="
            margin-bottom: 8px;
            color: #fbbf24;
            background: #23272e;
            border-radius: 6px;
            padding: 8px 12px;
            display: none;
          "
        ></div>
        <div id="pageArea" class="page-wrap">
          <div id="pageContainer">No page loaded</div>
        </div>

        <div id="detailArea" class="preview-panel" style="display: none">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; gap: 8px; align-items: center">
              <button id="toggleFull" class="btn" style="background: #334155">
                🔍 Show full page
              </button>
              <button
                id="naturalSizeBtn"
                class="btn"
                style="background: #475569"
              >
                1:1
              </button>
            </div>
            <div
              id="fullView"
              style="
                display: none;
                background: #061021;
                padding: 8px;
                border-radius: 6px;
                overflow: auto;
                max-width: 920px;
                max-height: 520px;
              "
            >
              <div
                id="fullContainer"
                style="position: relative; display: block"
              >
                <img
                  id="fullImg"
                  src=""
                  style="
                    display: block;
                    max-width: 100%;
                    height: auto;
                    border-radius: 4px;
                  "
                />
                <div
                  id="fullOverlay"
                  style="
                    position: absolute;
                    left: 0;
                    top: 0;
                    pointer-events: none;
                  "
                ></div>
              </div>
            </div>
          </div>
          <div class="thumbs" id="thumbs"></div>
          <div class="texts" id="texts"></div>
        </div>
      </div>
    </div>

    <script>
      const jsonFile = document.getElementById("jsonFile");
      const imgFolder = document.getElementById("imgFolder");
      const groupsList = document.getElementById("groupsList");
      const meta = document.getElementById("meta");
      const pageContainer = document.getElementById("pageContainer");
      const pageArea = document.getElementById("pageArea");
      const thumbs = document.getElementById("thumbs");
      const texts = document.getElementById("texts");
      const detailArea = document.getElementById("detailArea");

      let data = null;
      let filesMap = {};
      let currentSelected = null; // {pageIndex, groupIndex}
      let currentPage = 0;

      imgFolder.addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        filesMap = {};
        files.forEach((f) => (filesMap[f.name] = f));
        console.log("images folder loaded", files.length);
      });

      function resolvePath(path) {
        if (!path) return "";
        if (path.startsWith("data:") || path.startsWith("http")) return path;
        const name = path.split("/").pop();
        if (filesMap[name]) return URL.createObjectURL(filesMap[name]);
        return path;
      }

      jsonFile.addEventListener("change", async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const txt = await f.text();
        try {
          data = JSON.parse(txt);
        } catch (err) {
          alert("Invalid JSON: " + err);
          return;
        }
        renderGroups();
      });

      function renderGroups() {
        // Called once after JSON load. Reset and show page 0 groups.
        groupsList.innerHTML = "";
        pageContainer.innerHTML = "";
        thumbs.innerHTML = "";
        texts.innerHTML = "";
        detailArea.style.display = "none";
        currentSelected = null;
        currentPage = 0;
        if (!data) return;
        meta.textContent = `Source: ${data.source || "unknown"} — pages: ${
          data.total_pages || data.pages.length
        }`;
        renderGroupsForPage(currentPage);
        renderPageView(currentPage);
        updatePageInfo();
      }

      function renderGroupsForPage(pageIdx) {
        // Populate sidebar groups list for a single page (pageIdx).
        groupsList.innerHTML = "";
        if (!data || !data.pages || !data.pages[pageIdx]) return;
        const p = data.pages[pageIdx];
        const groups = p.groups || [];
        if (groups.length === 0) {
          const e = document.createElement("div");
          e.className = "small";
          e.textContent = "No groups on this page.";
          groupsList.appendChild(e);
          return;
        }
        groups.forEach((g, gi) => {
          const el = document.createElement("div");
          el.className = "group-item";
          el.innerHTML = `<strong>Group ${
            gi + 1
          }</strong><div class="group-meta">page ${p.page_number} — ${
            g.images.length
          } images, ${g.texts.length} texts</div>`;
          el.dataset.gi = gi;
          el.dataset.page = pageIdx;
          el.addEventListener("click", () => {
            // ensure sidebar selection keeps current page in sync
            currentPage = pageIdx;
            selectGroup(pageIdx, gi);
          });
          groupsList.appendChild(el);
        });
      }

      function renderPageView(pageIndex) {
        pageContainer.innerHTML = "";
        const p = data.pages[pageIndex];
        const img = document.createElement("img");
        img.className = "page-img";
        // prefer an image file from page.images[0].file
        let imgPath = "";
        // Prefer full page image if available
        if (p.full_image) {
          imgPath = p.full_image;
        } else if (p.images && p.images.length > 0) {
          imgPath = p.images[0].file;
        }
        img.src = resolvePath(imgPath) || "";
        img.alt = `page-${p.page_number}`;
        pageContainer.appendChild(img);

        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.style.left = "8px";
        ov.style.top = "8px";
        ov.style.pointerEvents = "none";
        pageContainer.appendChild(ov);

        // Show detected layout
        const layoutInfo = document.getElementById("layoutInfo");
        if (layoutInfo) {
          layoutInfo.textContent = p._detected_layout
            ? `Layout: ${p._detected_layout}`
            : "";
        }

        img.addEventListener("load", () => {
          // compute scale relative to PDF units
          const pageRect = {
            width: p.width || img.naturalWidth,
            height: p.height || img.naturalHeight,
            imgEl: img,
          };
          ov.innerHTML = "";
          (p.groups || []).forEach((g, gi) => {
            const box = makeBoxEl(g.bbox, pageRect);
            box.classList.add("group-box");
            box.dataset.pi = pageIndex;
            box.dataset.gi = gi;
            ov.appendChild(box);
          });

          // Render blocked items (text/image) so they are visible on-page
          try {
            const hide = document.getElementById("hideBlocked").checked;
            if (!hide) {
              (p.texts || []).forEach((t) => {
                try {
                  if (t && t.bbox && t.blocked) {
                    const bb = makeBoxEl(t.bbox, pageRect);
                    bb.classList.add("member-box", "blocked");
                    ov.appendChild(bb);
                  }
                } catch (e) {}
              });

              (p.images || []).forEach((im) => {
                try {
                  if (im && im.bbox && im.blocked) {
                    const bb = makeBoxEl(im.bbox, pageRect);
                    bb.classList.add("member-box", "blocked");
                    ov.appendChild(bb);
                  }
                } catch (e) {}
              });
            }
          } catch (e) {
            // ignore overlay errors
          }
        });
        updatePageInfo();
      }

      // Layout descriptions and handling strategies
      const layoutDetails = {
        catalog_grid: {
          desc: "<b>Catalog grid</b>: Product images are arranged in a wide, regular grid (like a catalog or lookbook). Each image usually pairs with a short caption, product code and a price. The spatial relationships are mostly horizontal — image above text or image beside a caption.",
          handle:
            "<b>Grouping strategy:</b> Aggressive horizontal search with a wide radius. We expand image boxes horizontally to capture captions and prices; allow up to ~12 text blocks so multi-line descriptions remain attached. Tight text-text grouping keeps multi-line captions intact.",
        },
        table_grid: {
          desc: "<b>Table grid</b>: A regular grid of visually similar cells (images and text) arranged in rows and columns. Each cell should be independent — merging across cell boundaries is undesirable.",
          handle:
            "<b>Grouping strategy:</b> Conservative thresholds and strict alignment checks. We require strong horizontal/vertical alignment and small search radii so each grid cell stays separate. Limit groups to small text counts to avoid cross-cell merges.",
        },
        multi_column: {
          desc: "<b>Multi-column</b>: Multiple vertical columns of flowing text (magazine, article), possibly with inline images. Text belongs to its column and shouldn't jump columns.",
          handle:
            "<b>Grouping strategy:</b> Respect column buckets — group text vertically inside the same column, attach images to the nearest column group, and prefer vertical proximity for caption attachment. Increase text-text grouping threshold within columns.",
        },
        sidebar: {
          desc: "<b>Sidebar</b>: Images/blocks appear on one side while the main body of text is on the opposite side (left or right). The relation between sidebar image and main text may cross a horizontal gap.",
          handle:
            "<b>Grouping strategy:</b> Use a wider horizontal search when matching sidebar images to nearby main content, with relaxed alignment checks across the page midline. Limit group expansion to avoid grabbing unrelated blocks.",
        },
        centered_cluster: {
          desc: "<b>Centered cluster</b>: One or more images are concentrated toward the center, with supporting text (captions) around them. Useful for feature spreads or hero sections.",
          handle:
            "<b>Grouping strategy:</b> Conservative radius with higher alignment requirements; keep clusters small so surrounding body text isn't swallowed. Prioritize nearest-image attachment and strict bbox overlap checks.",
        },
        vertical_flow: {
          desc: "<b>Vertical flow</b>: Reading order is top-to-bottom; images appear inline with columns of text (like a blog or article).",
          handle:
            "<b>Grouping strategy:</b> Favor vertical proximity to the image for captions and rely on reading-order heuristics. Allow moderate group sizes but respect text-only group boundaries.",
        },
        horizontal_strips: {
          desc: "<b>Horizontal strips</b>: Page content is organized into horizontal bands (strips), where related text and images lie in the same band.",
          handle:
            "<b>Grouping strategy:</b> Strong horizontal grouping across the strip; widen horizontal search and allow grouping of elements aligned within the band.",
        },
        scattered_dense: {
          desc: "<b>Scattered dense</b>: Many small elements packed closely (icons, thumbnails). Visual density is high and proximity thresholds should be tight.",
          handle:
            "<b>Grouping strategy:</b> Tight radii and strict merges: prefer small groups, prioritize bbox overlap, and avoid aggressive attachments.",
        },
        scattered_sparse: {
          desc: "<b>Scattered sparse</b>: Few elements spread across the page. Related items may be separated by larger gaps.",
          handle:
            "<b>Grouping strategy:</b> Increase search radius and directional tolerance to connect distant but related items (e.g., image + caption separated by whitespace). Allow larger groups but enforce capacity limits.",
        },
        full_page_single: {
          desc: "<b>Full page single</b>: One or a few very large elements dominate the page (hero images, title slides). The page is visually unified.",
          handle:
            "<b>Grouping strategy:</b> Aggressively group most content into a single group since everything likely belongs together. Use high radius and permissive alignment.",
        },
        mixed_density: {
          desc: "<b>Mixed density</b>: The page contains both dense clusters and sparse areas — e.g., a collage or mixed-content magazine page.",
          handle:
            "<b>Grouping strategy:</b> Adaptive: apply tight grouping inside dense clusters and looser rules for sparse regions. Use local density inspection before merging.",
        },
        scattered: {
          desc: "<b>Scattered</b>: Fallback/unclassified layout — treat conservatively or with default rules.",
          handle:
            "<b>Grouping strategy:</b> Use default thresholds with safe caps to avoid runaway groups.",
        },
      };

      function updatePageInfo() {
        const pageInfo = document.getElementById("pageInfo");
        const layoutDesc = document.getElementById("layoutDesc");
        if (!data || !data.pages) return;
        if (pageInfo) {
          pageInfo.textContent = `Page ${currentPage + 1} / ${
            data.pages.length
          }`;
        }
        // update layout info as well
        const layoutInfo = document.getElementById("layoutInfo");
        let layoutType =
          data.pages[currentPage] && data.pages[currentPage]._detected_layout;
        if (layoutInfo) {
          layoutInfo.textContent = layoutType ? `Layout: ${layoutType}` : "";
        }
        // Show layout description and handling
        if (layoutDesc) {
          if (layoutType && layoutDetails[layoutType]) {
            layoutDesc.style.display = "block";
            layoutDesc.innerHTML = `<b>Description:</b> ${layoutDetails[layoutType].desc}<br/><b>Grouping strategy:</b> ${layoutDetails[layoutType].handle}`;
          } else {
            layoutDesc.style.display = "none";
            layoutDesc.innerHTML = "";
          }
        }
      }

      function makeBoxEl(bbox, pageRect) {
        const [x0, y0, x1, y1] = bbox;
        const pw = pageRect.width,
          ph = pageRect.height;
        const img = pageRect.imgEl;
        // compute separate x/y scales based on displayed image size to maintain aspect
        const displayedW =
          img && img.clientWidth ? img.clientWidth : img.naturalWidth;
        const displayedH =
          img && img.clientHeight ? img.clientHeight : img.naturalHeight;
        const sx = displayedW / pw;
        const sy = displayedH / ph;
        const left = x0 * sx;
        const top = y0 * sy;
        const w = (x1 - x0) * sx;
        const h = (y1 - y0) * sy;
        const d = document.createElement("div");
        d.style.left = left + "px";
        d.style.top = top + "px";
        d.style.width = w + "px";
        d.style.height = h + "px";
        d.style.position = "absolute";
        return d;
      }

      function selectGroup(pageIndex, groupIndex) {
        currentSelected = { pageIndex, groupIndex };
        // render page view for that page
        renderPageView(pageIndex);
        // after render, highlight the group and show details
        setTimeout(() => {
          const p = data.pages[pageIndex];
          const ov = pageContainer.querySelector(".overlay");
          if (!ov) return;
          // remove previous highlights / member overlays
          ov.querySelectorAll(".group-box").forEach((n) =>
            n.classList.remove("group-selected")
          );
          ov.querySelectorAll(".member-box").forEach((n) => n.remove());
          const boxes = ov.querySelectorAll(".group-box");
          const target = Array.from(boxes).find(
            (b) => parseInt(b.dataset.gi, 10) === groupIndex
          );
          if (target) {
            target.classList.add("group-selected");
            target.scrollIntoView({ behavior: "smooth", block: "center" });

            // draw dashed member boxes for images and texts in page overlay
            const imgEl = pageContainer.querySelector(".page-img");
            const pageRect = {
              width: p.width || (imgEl ? imgEl.naturalWidth : 0),
              height: p.height || (imgEl ? imgEl.naturalHeight : 0),
              imgEl: imgEl,
            };

            // ensure page-level blocked overlays remain visible even when a group is selected
            try {
              const hide = document.getElementById("hideBlocked").checked;
              if (!hide) {
                (p.texts || []).forEach((t) => {
                  try {
                    if (t && t.bbox && t.blocked) {
                      const bb = makeBoxEl(t.bbox, pageRect);
                      bb.classList.add("member-box", "blocked");
                      ov.appendChild(bb);
                    }
                  } catch (e) {}
                });
                (p.images || []).forEach((im) => {
                  try {
                    if (im && im.bbox && im.blocked) {
                      const bb = makeBoxEl(im.bbox, pageRect);
                      bb.classList.add("member-box", "blocked");
                      ov.appendChild(bb);
                    }
                  } catch (e) {}
                });
              }
            } catch (e) {}

            // group object for this selection
            const g =
              p.groups && p.groups.length > 0 ? p.groups[groupIndex] : null;

            // draw each image/text member as a dashed box; mark blocked ones
            (g && g.images ? g.images : []).forEach((im) => {
              try {
                if (!im || !im.bbox) return;
                const b = makeBoxEl(im.bbox, pageRect);
                b.classList.add("member-box");
                if (im.blocked) b.classList.add("blocked");
                ov.appendChild(b);
              } catch (e) {
                /* ignore invalid bbox */
              }
            });

            (g && g.texts ? g.texts : []).forEach((t) => {
              try {
                if (!t || !t.bbox) return;
                const b = makeBoxEl(t.bbox, pageRect);
                b.classList.add("member-box");
                if (t.blocked) b.classList.add("blocked");
                ov.appendChild(b);
              } catch (e) {
                /* ignore invalid bbox */
              }
            });
          }

          // update sidebar selected state
          (groupsList.querySelectorAll(".group-item") || []).forEach((n) =>
            n.classList.remove("selected")
          );
          const sideEl = groupsList.querySelector(
            `[data-gi="${groupIndex}"][data-page="${pageIndex}"]`
          );
          if (sideEl) sideEl.classList.add("selected");

          // populate thumbs and texts
          const g =
            p.groups && p.groups.length > 0 ? p.groups[groupIndex] : null;
          thumbs.innerHTML = "";
          texts.innerHTML = "";
          detailArea.style.display = "flex";
          // prepare full view image (but don't auto-show unless toggle enabled)
          const fullImg = document.getElementById("fullImg");
          const fullOverlay = document.getElementById("fullOverlay");
          const fullView = document.getElementById("fullView");
          const toggle = document.getElementById("toggleFull");
          let fullPath =
            p.full_image || (p.images && p.images[0] && p.images[0].file) || "";
          fullImg.src = resolvePath(fullPath) || "";
          fullOverlay.innerHTML = "";
          fullImg.onload = () => {
            // size mapping from page units to displayed image pixels
            const pw = p.width || fullImg.naturalWidth;
            const ph = p.height || fullImg.naturalHeight;
            const displayedW =
              fullImg && fullImg.clientWidth
                ? fullImg.clientWidth
                : fullImg.naturalWidth;
            const displayedH =
              fullImg && fullImg.clientHeight
                ? fullImg.clientHeight
                : fullImg.naturalHeight;
            // position and size overlay to match the displayed image inside the relative container
            fullOverlay.style.position = "absolute";
            fullOverlay.style.left = "0px";
            fullOverlay.style.top = "0px";
            fullOverlay.style.width = displayedW + "px";
            fullOverlay.style.height = displayedH + "px";
            // account for potential devicePixelRatio if needed when interpreting bitmap pixels
            const dpr = window.devicePixelRatio || 1;
            const sx = displayedW / pw;
            const sy = displayedH / ph;
            // draw boxes for all groups, but highlight the selected one
            fullOverlay.innerHTML = "";
            (p.groups || []).forEach((grp, gi) => {
              const [x0, y0, x1, y1] = grp.bbox;
              const left = x0 * sx;
              const top = y0 * sy;
              const w = (x1 - x0) * sx;
              const h = (y1 - y0) * sy;
              const d = document.createElement("div");
              d.style.position = "absolute";
              d.style.left = left + "px";
              d.style.top = top + "px";
              d.style.width = w + "px";
              d.style.height = h + "px";
              d.style.boxSizing = "border-box";
              d.style.border = "3px solid rgba(250,180,80,0.9)";
              d.style.background = "rgba(250,180,80,0.06)";
              d.style.pointerEvents = "none";
              if (gi === groupIndex) {
                d.classList.add("group-selected");
              }
              fullOverlay.appendChild(d);
            });
            // draw member boxes inside fullOverlay for the selected group
            // clear any previous member boxes (prepare for drawing page-level blocked and group-members)
            fullOverlay
              .querySelectorAll(".member-box")
              .forEach((n) => n.remove());

            // then draw the page-level blocked items so they remain visible
            try {
              const hide = document.getElementById("hideBlocked").checked;
              if (!hide) {
                (p.texts || []).forEach((t) => {
                  try {
                    if (t && t.bbox && t.blocked) {
                      const [x0, y0, x1, y1] = t.bbox;
                      const left = x0 * sx;
                      const top = y0 * sy;
                      const w = (x1 - x0) * sx;
                      const h = (y1 - y0) * sy;
                      const eb = document.createElement("div");
                      eb.style.position = "absolute";
                      eb.style.left = left + "px";
                      eb.style.top = top + "px";
                      eb.style.width = w + "px";
                      eb.style.height = h + "px";
                      eb.className = "member-box blocked";
                      fullOverlay.appendChild(eb);
                    }
                  } catch (e) {}
                });
                (p.images || []).forEach((im) => {
                  try {
                    if (im && im.bbox && im.blocked) {
                      const [x0, y0, x1, y1] = im.bbox;
                      const left = x0 * sx;
                      const top = y0 * sy;
                      const w = (x1 - x0) * sx;
                      const h = (y1 - y0) * sy;
                      const eb = document.createElement("div");
                      eb.style.position = "absolute";
                      eb.style.left = left + "px";
                      eb.style.top = top + "px";
                      eb.style.width = w + "px";
                      eb.style.height = h + "px";
                      eb.className = "member-box blocked";
                      fullOverlay.appendChild(eb);
                    }
                  } catch (e) {}
                });
              }
            } catch (e) {}
            const selGrp = p.groups[groupIndex];
            if (selGrp) {
              (selGrp.images || []).forEach((im) => {
                try {
                  if (!im || !im.bbox) return;
                  const [x0, y0, x1, y1] = im.bbox;
                  const left = x0 * sx;
                  const top = y0 * sy;
                  const w = (x1 - x0) * sx;
                  const h = (y1 - y0) * sy;
                  const mb = document.createElement("div");
                  mb.style.position = "absolute";
                  mb.style.left = left + "px";
                  mb.style.top = top + "px";
                  mb.style.width = w + "px";
                  mb.style.height = h + "px";
                  mb.className = "member-box";
                  if (im.blocked) mb.classList.add("blocked");
                  fullOverlay.appendChild(mb);
                } catch (e) {}
              });

              (selGrp.texts || []).forEach((t) => {
                try {
                  if (!t || !t.bbox) return;
                  const [x0, y0, x1, y1] = t.bbox;
                  const left = x0 * sx;
                  const top = y0 * sy;
                  const w = (x1 - x0) * sx;
                  const h = (y1 - y0) * sy;
                  const mb = document.createElement("div");
                  mb.style.position = "absolute";
                  mb.style.left = left + "px";
                  mb.style.top = top + "px";
                  mb.style.width = w + "px";
                  mb.style.height = h + "px";
                  mb.className = "member-box";
                  if (t.blocked) mb.classList.add("blocked");
                  fullOverlay.appendChild(mb);
                } catch (e) {}
              });
            }

            // center selected group in the scrollable fullView
            const selBox = fullOverlay.children[groupIndex];
            if (selBox) {
              const container = document.getElementById("fullView");
              const cx = selBox.offsetLeft + selBox.offsetWidth / 2;
              const cy = selBox.offsetTop + selBox.offsetHeight / 2;
              container.scrollLeft = Math.max(
                0,
                cx - container.clientWidth / 2
              );
              container.scrollTop = Math.max(
                0,
                cy - container.clientHeight / 2
              );
            }
          };
          const hide = document.getElementById("hideBlocked").checked;
          (g.images || []).forEach((im) => {
            if (hide && im.blocked) return;
            const div = document.createElement("div");
            div.className = "thumb";
            const img = document.createElement("img");
            img.src = resolvePath(im.file) || "";
            div.appendChild(img);
            // click thumbnail to open the image in a new tab
            div.addEventListener("click", () => {
              const fp = resolvePath(im.file) || "";
              if (fp) window.open(fp, "_blank");
            });
            thumbs.appendChild(div);
            if (im.blocked) {
              div.classList.add("blocked");
              const tag = document.createElement("div");
              tag.className = "muted";
              tag.textContent = `Blocked: ${im.blocked_reason || "image_junk"}`;
              div.appendChild(tag);
            }
          });
          (g.texts || []).forEach((t) => {
            if (hide && t.blocked) return;
            const d = document.createElement("div");
            d.className = "text-block";
            d.innerHTML = `<div style="font-weight:600">${
              t.id || ""
            }</div><div style="white-space:pre-wrap">${(
              t.content ||
              t.text ||
              t
            ).toString()}</div>`;
            // Show font, size, color, width & height when available
            const meta = [];
            if (t.font) meta.push(`Font: ${t.font}`);
            if (t.size) meta.push(`Size: ${t.size}`);
            if (t.color) meta.push(`Color: ${t.color}`);
            if (t.width && t.height) meta.push(`Box: ${t.width}x${t.height}`);
            if (meta.length)
              d.innerHTML += `<div class="muted">${meta.join(" • ")}</div>`;
            if (t.blocked) {
              d.classList.add("blocked");
              d.innerHTML += `<div class="muted">Blocked: ${
                t.blocked_reason || "unknown"
              }</div>`;
            }
            texts.appendChild(d);
          });
        }, 120);
      }
      // Toggle full page view
      (function () {
        const btn = document.getElementById("toggleFull");
        if (!btn) return;
        btn.addEventListener("click", () => {
          const fv = document.getElementById("fullView");
          if (!fv) return;
          if (fv.style.display === "none" || fv.style.display === "") {
            fv.style.display = "block";
            btn.textContent = "🔍 Hide full page";
          } else {
            fv.style.display = "none";
            btn.textContent = "🔍 Show full page";
          }
        });
      })();

      // Carousel navigation (keeps sidebar groups and layout info in sync)
      (function () {
        const prevBtn = document.getElementById("prevPageBtn");
        const nextBtn = document.getElementById("nextPageBtn");
        if (!prevBtn || !nextBtn) return;
        prevBtn.addEventListener("click", () => {
          if (!data || !data.pages) return;
          if (currentPage > 0) {
            currentPage--;
            renderGroupsForPage(currentPage);
            renderPageView(currentPage);
            thumbs.innerHTML = "";
            texts.innerHTML = "";
            detailArea.style.display = "none";
            updatePageInfo();
          }
        });
        nextBtn.addEventListener("click", () => {
          if (!data || !data.pages) return;
          if (currentPage < data.pages.length - 1) {
            currentPage++;
            renderGroupsForPage(currentPage);
            renderPageView(currentPage);
            thumbs.innerHTML = "";
            texts.innerHTML = "";
            detailArea.style.display = "none";
            updatePageInfo();
          }
        });
      })();

      // react to hideBlocked toggles so overlays update immediately
      (function () {
        const cb = document.getElementById("hideBlocked");
        if (!cb) return;
        cb.addEventListener("change", () => {
          // refresh page overlays and selection rendering
          if (!data || !data.pages) return;
          renderPageView(currentPage);
          if (currentSelected) {
            // slight delay to ensure pageContainer overlays exist
            setTimeout(() => {
              selectGroup(
                currentSelected.pageIndex,
                currentSelected.groupIndex
              );
            }, 120);
          }
        });
      })();
    </script>
  </body>
</html>
